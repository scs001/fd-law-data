# wenshu-crawl CronJob — xinru cluster, scraw namespace.
# Standalone manifest (the helm-law-scraw chart installs the full scrapyd
# stack; xinru/scraw only needs this crawler). Sourced from the chart's
# wenshu-crawl-cronjob.yaml template with concrete values.
#
# Prereqs (applied separately):
#   kubectl -n scraw create secret docker-registry harbor-lawcraw-pull \
#     --docker-server=100.64.0.8:30880 \
#     --docker-username='<robot>' --docker-password='<token>'
#   kubectl -n scraw create secret generic wenshu-crawl-credentials \
#     --from-literal=rustfs-access-key=<key> --from-literal=rustfs-secret-key=<secret> \
#     --from-literal=wenshu-account-user=<user> --from-literal=wenshu-account-password=<password>
# Placeholders only — REAL VALUES NEVER COMMITTED; create the Secret locally.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wenshu-crawl
  namespace: scraw
  labels:
    app.kubernetes.io/name: wenshu-crawl
    app.kubernetes.io/part-of: finddata
spec:
  schedule: "0 17 * * *"        # 01:00 Asia/Shanghai (nodes run UTC)
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 72000   # ~20 h
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wenshu-crawl
        spec:
          imagePullSecrets:
            - name: harbor-lawcraw-pull
          restartPolicy: OnFailure
          containers:
            - name: crawler
              # placeholder tag — bump on build (docker buildx via cheap-1 law-builder)
              image: 100.64.0.8:30880/lawcraw_business/fd-law-data-wenshu:v0.1.0
              imagePullPolicy: IfNotPresent
              env:
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.11:9000"   # tailnet-internal RustFS
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: wenshu-crawl-credentials
                      key: rustfs-access-key
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: wenshu-crawl-credentials
                      key: rustfs-secret-key
                - name: RUSTFS_REGION
                  value: "us-east-1"
                - name: WENSHU_BUCKET
                  value: "wenshu"
                - name: WENSHU_RATE_MS
                  value: "1000"
                - name: WENSHU_LOOKBACK_DAYS
                  value: "7"
                - name: WENSHU_RESULT_CAP
                  value: "200"
                - name: WENSHU_BUDGET_MS
                  value: "68400000"
                - name: WENSHU_ACCOUNT_USER
                  valueFrom:
                    secretKeyRef:
                      name: wenshu-crawl-credentials
                      key: wenshu-account-user
                - name: WENSHU_ACCOUNT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wenshu-crawl-credentials
                      key: wenshu-account-password
                # Sticky exit IP per account via fd-proxy-service (design.md D6);
                # leave unset = direct.
                # - name: WENSHU_PROXY_URL
                #   value: "http://fd-proxy-service.scraw.svc.cluster.local:8080"
              command: ["node", "bin/wenshu-crawl.mjs"]
