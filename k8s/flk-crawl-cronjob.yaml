# flk-law-crawl CronJob — xinru cluster, scraw namespace.
#
# ⚠ SUPERSEDED (2026-10-14): the live object is chart-managed — apply
# helm-law-scraw (`helm template law-craw . --namespace scraw | kubectl apply -n
# scraw -f -`), which pins this same image tag. This standalone copy is kept for
# reference only; do NOT apply it (it would fight the chart).
#
# 2026-10-14 incident sync: image moved off the retired Harbor
# (100.64.0.8:30880, decommissioned 2026-10-11) onto ccr, pinned to the legal
# line's anchored tag. No imagePullSecrets: nodes carry ccr credentials.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flk-law-crawl
  namespace: scraw
  labels:
    app.kubernetes.io/name: flk-law-crawl
    app.kubernetes.io/part-of: finddata
spec:
  schedule: "30 2 * * *"       # 02:30 Asia/Shanghai (nodes run Beijing time)
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flk-law-crawl
        spec:
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: ccr.ccs.tencentyun.com/lawcraw-business/fd-law-data:sha-b63d0d1
              imagePullPolicy: IfNotPresent
              env:
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.5:9000"   # tailnet-internal RustFS
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: flk-law-crawl-credentials
                      key: rustfs-access-key
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: flk-law-crawl-credentials
                      key: rustfs-secret-key
                - name: RUSTFS_REGION
                  value: "us-east-1"
                - name: LAWS_BUCKET
                  value: "laws"
                - name: FLK_RATE_MS
                  value: "1100"
                - name: FLK_PAGE_SIZE
                  value: "100"
                - name: FLK_LOOKBACK_DAYS
                  value: "7"
              command: ["node", "bin/flk-crawl.mjs"]
