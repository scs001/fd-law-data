# 指导性案例专栏 crawl CronJob — xinru cluster, scraw namespace.
#
# Suspended by default: the column publishes in batches a few times a year
# (16 batches since 2011), so there is nothing to gain from a schedule and
# everything to lose from touching the site unattended. Enable it only after
# a manual run has been reconciled against the bucket (design.md D9).
#
# Image note (updated 2026-10-14): built via GitHub Actions -> hkccr ->
# cheap-3 tcr-relay -> ccr, tagged with an immutable sha-<short>. The retired
# Jenkins->Harbor channel is gone (Harbor decommissioned 2026-10-11); this
# file still pointed at it and the tag no longer exists anywhere, so a manual
# apply would have created an unpullable Job. Now pinned to the legal line's
# anchored tag (helm-law-scraw values.yaml holds the same pin).
#
# Prereqs: flk-law-crawl-credentials secret (already present). No pull secret:
# nodes carry ccr credentials.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: guide-cases-crawl
  namespace: scraw
  labels:
    app.kubernetes.io/name: guide-cases-crawl
    app.kubernetes.io/part-of: finddata
spec:
  # 03:30 on the 1st of Jan/Apr/Jul/Oct — the batch cadence, not a daily one.
  schedule: "30 3 1 1,4,7,10 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A full sweep is ~293 requests at >=1s pacing: minutes, not hours.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: guide-cases-crawl
        spec:
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: ccr.ccs.tencentyun.com/lawcraw-business/fd-law-data:sha-b63d0d1
              imagePullPolicy: IfNotPresent
              env:
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.5:9000"   # tailnet-internal RustFS
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: flk-law-crawl-credentials
                      key: rustfs-access-key
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: flk-law-crawl-credentials
                      key: rustfs-secret-key
                - name: RUSTFS_REGION
                  value: "us-east-1"
                - name: LAWS_BUCKET
                  value: "laws"
                - name: GUIDE_CASES_PREFIX
                  value: "guide-cases/"
                # Politeness floor: the crawl is sequential and never retries an
                # anomalous response (specs/court-guiding-cases).
                - name: GUIDE_CASES_RATE_MS
                  value: "1100"
              command: ["node", "bin/guide-cases-crawl.mjs"]
