apiVersion: batch/v1
kind: CronJob
metadata:
  name: flk-law-backfill
  namespace: scraw
  labels:
    app.kubernetes.io/name: flk-law-backfill
    app.kubernetes.io/part-of: finddata
spec:
  # Run every 4h while the one-window-per-run historical backfill is active.
  schedule: "0 */4 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flk-law-backfill
        spec:
          imagePullSecrets:
            - name: harbor-lawcraw-pull
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: 100.64.0.8:30880/lawcraw_business/fd-law-data:v0.2.0-legal-sources
              imagePullPolicy: IfNotPresent
              env:
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.11:9000"
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-access-key }
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-secret-key }
                - name: RUSTFS_REGION
                  value: "us-east-1"
                - name: LAWS_BUCKET
                  value: "laws"
                - name: FLK_PAGE_SIZE
                  value: "100"
                - name: FLK_RATE_MS
                  value: "1100"
              command:
                - node
                - bin/flk-crawl.mjs
                - --backfill
                - --until
                - "2026-09-23"
                - --batch-days
                - "365"
