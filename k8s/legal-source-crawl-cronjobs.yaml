# Wave-1 authoritative legal sources. Crawl Jobs write object storage; loader
# Jobs are the only objects that receive PostgreSQL credentials. All scheduled
# Jobs ship suspended until their real run/load pair has been verified.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rmfyalk-case-crawl
  namespace: scraw
  labels:
    app.kubernetes.io/name: rmfyalk-case-crawl
    app.kubernetes.io/part-of: finddata
spec:
  schedule: "10 3 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rmfyalk-case-crawl
            legal.finddata.io/source: rmfyalk-case-library
            legal.finddata.io/account: acct001
        spec:
          imagePullSecrets:
            - name: harbor-lawcraw-pull
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: 100.64.0.8:30880/lawcraw_business/legal-auth-broker:sha-4b79ec5
              imagePullPolicy: IfNotPresent
              env:
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.11:9000"
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-access-key }
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-secret-key }
                - name: RUSTFS_REGION
                  value: "us-east-1"
                - name: LAWS_BUCKET
                  value: "laws"
                - name: LEGAL_AUTH_BROKER_TOKEN
                  valueFrom:
                    secretKeyRef: { name: legal-auth-broker, key: broker-token }
                - name: LEGAL_AUTH_JAR_KEY
                  valueFrom:
                    secretKeyRef: { name: legal-auth-broker, key: jar-key }
                - name: LEGAL_AUTH_CRAWL_PROXY_URL
                  valueFrom:
                    secretKeyRef: { name: legal-identity-rmfyalk-acct001, key: crawl_proxy_url }
                - name: LEGAL_AUTH_LOGIN_PROXY_URL
                  valueFrom:
                    secretKeyRef: { name: legal-identity-rmfyalk-acct001, key: login_proxy_url }
              command:
                - node
                - bin/rmfyalk-crawl.mjs
                - --account-id
                - acct001
                - --auth-broker
                - http://legal-auth-broker.scraw
                - --rate-ms
                - "1100"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rmfyalk-case-load
  namespace: scraw
  labels:
    app.kubernetes.io/name: rmfyalk-case-load
    app.kubernetes.io/part-of: finddata
spec:
  schedule: "30 5 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rmfyalk-case-load
            legal.finddata.io/source: rmfyalk-case-library
        spec:
          imagePullSecrets:
            - name: harbor-lawcraw-pull
          restartPolicy: OnFailure
          containers:
            - name: loader
              image: 100.64.0.8:30880/lawcraw_business/fd-law-data:sha-8ca7733
              imagePullPolicy: IfNotPresent
              env:
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.11:9000"
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-access-key }
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-secret-key }
                - name: RUSTFS_REGION
                  value: "us-east-1"
                - name: LAWS_BUCKET
                  value: "laws"
                - name: PG_HOST
                  value: "100.64.0.5"
                - name: PG_PORT
                  value: "5432"
                - name: PG_DATABASE
                  value: "law_db"
                - name: PG_USER
                  valueFrom:
                    secretKeyRef: { name: flk-law-pg-credentials, key: pg-user }
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: flk-law-pg-credentials, key: pg-password }
              command: ["node", "bin/rmfyalk-load.mjs", "--source", "rmfyalk-case-library"]
---
