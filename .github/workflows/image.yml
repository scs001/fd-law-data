# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive).
# Jenkins→Harbor remains the fallback channel for this repo.
#
# Matrix on push: fd-law-data (flk crawler) + fd-law-data-auth-broker.
# The wenshu variant (fd-law-data-wenshu, Playwright, heavy) is dispatch-only
# — mirrors the Jenkins BUILD_WENSHU default-off convention.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wenshu:
        description: "Also build the wenshu variant (Playwright, heavy)"
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: lawcraw-business

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fd-law-data
            dockerfile: Dockerfile
          - image: fd-law-data-auth-broker
            dockerfile: Dockerfile.auth-broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-wenshu:
    if: github.event_name == 'workflow_dispatch' && inputs.wenshu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/fd-law-data-wenshu
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wenshu
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
