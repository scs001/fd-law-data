# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive);
# extended per retire-jenkins-harbor §3.2 (2026-10-09): wenshu + auth-broker
# join the push matrix as the Jenkins→Harbor channel retires.
#
# 三镜像一次推送全绿（matrix，形态同 fd-wire build.yml）：
#   fd-law-data         ← Dockerfile（flk/legal-source 爬虫主镜像）
#   legal-auth-broker   ← Dockerfile.auth-broker（部署清单按此名引用；原名
#                          fd-law-data-auth-broker 无消费方，2026-10-09 改名对齐）
#   fd-law-data-wenshu  ← Dockerfile.wenshu（Playwright 重镜像；原 dispatch-only
#                          沿 Jenkins BUILD_WENSHU 默认关惯例——Jenkins 退役后
#                          该惯例随之消亡，改为每次 push 必建）
# tag = sha-${GITHUB_SHA::7} + 滚动 main。
#
# 构建发生在 scs001/fd-law-data **公开**镜像仓（本文件为真源，随主干同步过去）。
# 2026-10-19 实证：私有仓的 Actions 按分钟计费，额度耗尽后 job 在启动阶段直接
# 失败（无 runner、2 秒内结束，看起来像 workflow 写错了）；同一份 workflow 在
# 公开仓不限时免费。该镜像仓只放构建所需文件（bin/ lib/ test/ scripts/
# Dockerfile* + 本 workflow），k8s/ 与内网地址留在私有基础设施仓。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: lawcraw-business

jobs:
  # 测试先跑：爬虫切片/分页/幂等与 auth-broker 会话状态机是核心不变量，
  # 测试不过不应出片。node --test 全部离线（Playwright 只做 DOM 解析，不起浏览器）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Test suite
        run: npm test

  build-push:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fd-law-data
            dockerfile: Dockerfile
          - image: legal-auth-broker
            dockerfile: Dockerfile.auth-broker
          - image: fd-law-data-wenshu
            dockerfile: Dockerfile.wenshu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
