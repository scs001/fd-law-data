# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-09-30 user directive);
# extended per retire-jenkins-harbor §3.2 (2026-10-09): wenshu + auth-broker
# join the push matrix as the Jenkins→Harbor channel retires.
#
# 三镜像一次推送全绿（matrix，形态同 fd-wire build.yml）：
#   fd-law-data         ← Dockerfile（flk/legal-source 爬虫主镜像）
#   legal-auth-broker   ← Dockerfile.auth-broker（Harbor 侧镜像名：k8s 清单引
#                          lawcraw_business/legal-auth-broker、cheap-3 tcr-relay
#                          repos.conf 亦按此名登记；原 GHA 用的
#                          fd-law-data-auth-broker 从未进 relay=ccr 侧无引用，
#                          2026-10-09 改名对齐，避免双名分叉）
#   fd-law-data-wenshu  ← Dockerfile.wenshu（Playwright 重镜像；原 dispatch-only
#                          沿 Jenkins BUILD_WENSHU 默认关惯例——Jenkins 退役后
#                          该惯例随之消亡，改为每次 push 必建）
# tag = sha-${GITHUB_SHA::7} + 滚动 main。
#
# org GHA 私有仓被 billing 挡（2026-10-07T13:11Z 起全红，job 未启动级失败）：
# 实际构建发生在 scs001/fd-law-data 个人镜像仓（免费 minutes，形态同
# scs001/fd-wire）；本文件为真源，随主干同步镜像仓。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: lawcraw-business

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fd-law-data
            dockerfile: Dockerfile
          - image: legal-auth-broker
            dockerfile: Dockerfile.auth-broker
          - image: fd-law-data-wenshu
            dockerfile: Dockerfile.wenshu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
